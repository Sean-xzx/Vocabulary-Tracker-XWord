name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check publication files, documentation and resources
        run: node scripts/verify-repository.mjs
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Code and design rules
        run: npm run lint
      - name: Real-window core flows with isolated data and mock services
        run: npm run e2e
      - name: Build Windows installer
        run: npm run build
